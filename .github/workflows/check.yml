name: Checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.6.5'
      - run: sudo apt-get update && sudo apt-get install -y unar
      - run: make install
      - run: make check
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: make test-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
      - run: uv sync --locked
      - run: docker build -t stacks:test .
      - run: uv run python scripts/container_smoke.py stacks:test
