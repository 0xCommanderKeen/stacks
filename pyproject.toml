[project]
name = "stacks-library"
version = "0.1.0"
description = "A personal library for books, comics, and audiobooks"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.8,<3",
  "defusedxml>=0.7,<1",
  "pillow>=11,<13",
  "argon2-cffi>=23,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
stacks = "stacks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/stacks"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
